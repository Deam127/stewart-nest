<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f5d50">
  <title>The Stewart Nest</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Stewart Nest">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="top" hidden>
    <div class="brand"><img class="logo" src="/icon.svg" alt=""> <span>The Stewart Nest</span></div>
    <div class="top-right">
      <span id="baby" class="chip baby" title="Countdown"></span>
      <button id="bell" class="icon-btn" aria-label="Notifications">🔔<span id="bell-n" hidden></span></button>
      <button id="me-btn" class="avatar" aria-label="Me"></button>
    </div>
  </header>

  <main id="view"></main>

  <div id="notif-panel" class="panel" hidden></div>
  <div id="toast" hidden></div>

  <nav id="nav" hidden>
    <a href="#calendar" data-r="calendar"><span>📅</span>Calendar</a>
    <a href="#today" data-r="today"><span>✅</span>My day</a>
    <a href="#chat" data-r="chat" data-perm="chat"><span>💬</span>Chat<i id="chat-n" hidden></i></a>
    <a href="#shop" data-r="shop" data-perm="shopping"><span>🛒</span>Shop</a>
    <a href="#hub" data-r="hub"><span>🏡</span>Family</a>
  </nav>

  <div id="scanner" hidden><video playsinline muted></video><div class="scan-bar"><span>Point the camera at the barcode</span><button class="btn small ghost" id="scan-type">Type it</button><button class="btn small" id="scan-close">Cancel</button></div></div>

  <script src="/alerts.js"></script>
  <script src="/app.js"></script>
  <script src="/phase2.js"></script>
  <script src="/phase3.js"></script>
  <script src="/phase4.js"></script>
  <script src="/phase5.js"></script>
  <script src="/phase6.js"></script>
  <script src="/phase7.js"></script>
</body>
</html>
